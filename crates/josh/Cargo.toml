[package]
name = "josh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
allen-bytecode = { path = "../allen-bytecode" }
allen-compiler = { path = "../allen-compiler" }
allen-exec = { path = "../allen-exec" }
allen-package = { path = "../allen-package" }
allen-schema = { path = "../allen-schema" }
base64 = "0.22"
josh-host = { path = "../josh-host" }
josh-protocol = { path = "../josh-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

