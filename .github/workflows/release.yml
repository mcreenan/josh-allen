name: Release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.1.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/check-release-version.sh "$RELEASE_TAG"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            rust-target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - platform: macos-aarch64
            rust-target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.rust-target }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build release archive
        run: scripts/package-release.sh "${{ matrix.platform }}" "${{ matrix.rust-target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: josh-allen-${{ matrix.platform }}
          path: target/release-package/josh-allen-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: josh-allen-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum josh-allen-*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "JOSH/ALLEN ${GITHUB_REF_NAME#v}"
